<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FDF8F3">
<title>小图鉴 · Pico Atlas</title>
<style>
  :root{
    --bg:#FDF8F3; --ink:#2E2A26; --ink2:#8A8178; --ink3:#B9AFA4;
    --en:#3C7DD9; --brand:#F5904A; --line:#EFE6DC;
    --pic:65;                       /* 图片区 flex 比例，按年龄改 */
    --f-zh:56px; --f-py:20px; --f-en:30px; --f-sent:22px; --f-fact:18px;
    --f-line:27px; --f-story:26px; --f-pic:clamp(112px,29vh,320px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    user-select:none; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.on{display:flex}

  /* ══════════ 年龄选择（仅首次） ══════════ */
  #ageScreen{padding:32px 24px;justify-content:center;gap:14px}
  .age-title{font-size:26px;font-weight:800;text-align:center;margin-bottom:8px}
  .age-sub{font-size:15px;color:var(--ink2);text-align:center;margin-bottom:26px}
  .age-btn{
    border:0;cursor:pointer;font-family:inherit;
    background:#fff;color:var(--ink);font-size:24px;font-weight:800;
    padding:34px;border-radius:26px;
    box-shadow:0 4px 16px rgba(120,90,60,.10);
    transition:.18s;
  }
  .age-btn small{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-top:6px}
  .age-btn:active{transform:scale(.97);background:#FFF6EE}

  /* ══════════ 首页：三个入口 ══════════ */
  #homeScreen{padding:0}
  .home-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
  .logo{font-size:20px;font-weight:800;letter-spacing:.5px}
  .logo span{color:var(--brand)}
  .age-tag{
    border:0;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:700;color:var(--ink3);
    background:#F2EAE0;padding:6px 11px;border-radius:9px;
  }
  .entries{flex:1;display:flex;flex-direction:column;gap:14px;padding:10px 20px 26px;min-height:0}
  .entry{
    flex:1;border:0;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;gap:22px;padding:0 30px;
    border-radius:28px;background:#fff;color:var(--ink);
    box-shadow:0 6px 20px rgba(120,90,60,.10);
    transition:.18s;
  }
  .entry:active{transform:scale(.975)}
  .entry .ico{font-size:52px;line-height:1}
  .entry .txt{text-align:left}
  .entry .t1{font-size:30px;font-weight:800;letter-spacing:2px}
  .entry .t2{font-size:14px;color:var(--ink2);margin-top:4px;letter-spacing:1px}
  .entry .prog{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:700}

  /* ══════════ 卡片流 ══════════ */
  #cardScreen{position:relative}
  .topbar{display:flex;align-items:center;gap:12px;padding:12px 18px 8px}
  .home-btn{
    width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;cursor:pointer;
    background:#fff;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.07);
    display:grid;place-items:center;font-family:inherit;
  }
  .home-btn:active{transform:scale(.92)}
  .bar-wrap{flex:1}
  .bar{height:5px;background:#EFE6DC;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
  .counter{font-size:12px;color:var(--ink3);font-weight:700;margin-top:5px;text-align:right;letter-spacing:.5px}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 18px;min-height:0}

  .card{
    width:100%;max-width:420px;height:100%;
    border-radius:34px;overflow:hidden;
    box-shadow:0 14px 40px rgba(120,90,60,.14);
    display:flex;flex-direction:column;
    transition:background .35s ease, transform .28s;
    position:relative;
  }
  .pic-area{
    flex:1 1 auto; min-height:0; overflow:hidden;
    display:flex;align-items:center;justify-content:center;padding:14px;
  }
  .pic{
    font-size:max(68px,var(--f-pic));line-height:1;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.13));
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .card:active .pic{transform:scale(.95)}

  .text-area{
    flex:0 0 auto; position:relative; z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:4px 22px 30px;gap:3px;
  }

  .zh{font-size:var(--f-zh);font-weight:800;letter-spacing:2px;line-height:1.15;transition:.22s}
  .py{font-size:var(--f-py);color:var(--ink2);letter-spacing:.5px}
  .en{font-size:var(--f-en);font-weight:700;color:var(--en);letter-spacing:.4px;transition:.22s}
  .sent-zh{font-size:var(--f-sent);color:var(--ink2);text-align:center;margin-top:8px;line-height:1.45}
  .sent-en{font-size:var(--f-sent);color:var(--en);font-weight:600;text-align:center;line-height:1.45}
  .fact{
    font-size:var(--f-fact);color:var(--ink3);text-align:center;
    margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);width:100%;line-height:1.4;
  }
  .lit{opacity:1}
  .dim{opacity:.25}

  /* 古诗 */
  .lines{display:flex;flex-direction:column;gap:9px;align-items:center}
  .line{
    font-size:var(--f-line);font-weight:700;letter-spacing:3px;
    transition:.22s;text-align:center;white-space:nowrap;
  }
  .poem-meta{font-size:14px;color:var(--ink2);letter-spacing:1.5px;margin-top:14px}
  .poem-explain{font-size:15px;color:var(--ink3);text-align:center;margin-top:8px;line-height:1.4;padding:0 8px}

  /* 故事 */
  .story-tag{
    position:absolute;top:14px;left:14px;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.85);color:var(--ink2);
    padding:5px 11px;border-radius:9px;letter-spacing:1px;backdrop-filter:blur(6px);
  }
  .story-title{font-size:15px;color:var(--ink2);letter-spacing:1px;margin-bottom:6px}
  .story-text{font-size:var(--f-story);font-weight:700;text-align:center;line-height:1.5;letter-spacing:1px}

  /* 数数 */
  .num-visual{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:260px}
  .num-visual span{font-size:clamp(48px,9.5vh,82px);line-height:1}
  .num-big{font-size:clamp(76px,22vw,104px);font-weight:900;line-height:1;color:var(--brand)}

  /* 形状 */
  .shape-visual{display:grid;place-items:center} .shape-visual svg{width:100%;height:100%;display:block}
  

  /* 底部控制 */
  .controls{display:flex;align-items:center;justify-content:center;gap:26px;padding:10px 24px 22px}
  .nav-btn{
    width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
    background:#fff;color:var(--ink2);font-size:22px;font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,.08);display:grid;place-items:center;transition:.18s;
  }
  .nav-btn:active{transform:scale(.92)}
  .nav-btn:disabled{opacity:.28}
  .play{
    width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;
    background:var(--brand);color:#fff;font-size:25px;font-family:inherit;
    display:grid;place-items:center;box-shadow:0 6px 20px rgba(245,144,74,.42);
    transition:.18s;
  }
  .play:active{transform:scale(.93)}
  .play.playing{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(245,144,74,.42)}50%{box-shadow:0 6px 36px rgba(245,144,74,.75)}}

  /* 提示 */
  .toast{
    position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(12px);
    background:rgba(46,42,38,.9);color:#fff;font-size:14px;padding:10px 18px;
    border-radius:999px;opacity:0;pointer-events:none;transition:.28s;
    white-space:nowrap;backdrop-filter:blur(8px);z-index:99;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ══════════ 年龄选择 ══════════ -->
<div class="screen" id="ageScreen">
  <div class="age-title">小朋友几岁啦？</div>
  <div class="age-sub">选一次就好，以后可以改</div>
  <button class="age-btn" data-age="L1">3 – 4 岁<small>看图片，认东西</small></button>
  <button class="age-btn" data-age="L2">4 – 5 岁<small>加拼音和小短句</small></button>
  <button class="age-btn" data-age="L3">5 – 6 岁<small>加汉字和小知识</small></button>
</div>

<!-- ══════════ 首页 ══════════ -->
<div class="screen" id="homeScreen">
  <div class="home-top">
    <div class="logo">小<span>图鉴</span></div>
    <button class="age-tag" id="ageTag">3–4 岁</button>
  </div>
  <div class="entries">
    <button class="entry" data-lane="look">
      <div class="ico">🍎</div>
      <div class="txt"><div class="t1">认东西</div><div class="t2">水果 · 动物 · 电器</div></div>
      <div class="prog" data-prog="look"></div>
    </button>
    <button class="entry" data-lane="read">
      <div class="ico">📖</div>
      <div class="txt"><div class="t1">读一读</div><div class="t2">古诗 · 小故事</div></div>
      <div class="prog" data-prog="read"></div>
    </button>
    <button class="entry" data-lane="play">
      <div class="ico">🎨</div>
      <div class="txt"><div class="t1">玩一玩</div><div class="t2">数数 · 形状</div></div>
      <div class="prog" data-prog="play"></div>
    </button>
  </div>
</div>

<!-- ══════════ 卡片流 ══════════ -->
<div class="screen" id="cardScreen">
  <div class="topbar">
    <button class="home-btn" id="homeBtn">🏠</button>
    <div class="bar-wrap">
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <div class="counter" id="counter">1 / 1</div>
    </div>
  </div>
  <div class="stage"><div class="card" id="card"><div id="cardInner" style="display:flex;flex-direction:column;height:100%"></div></div></div>
  <div class="controls">
    <button class="nav-btn" id="prev">‹</button>
    <button class="play" id="play">▶</button>
    <button class="nav-btn" id="next">›</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═════════════════════════════════════════════════════════
   一、状态（localStorage 持久化）
   ═════════════════════════════════════════════════════════ */
const KEY = 'pico-atlas';
const DEFAULT = () => ({
  v: 1,
  ageBand: null,
  progress: {
    look: { lastId: null, seen: [] },
    read: { lastId: null, seen: [] },
    play: { lastId: null, seen: [] }
  },
  prefs: { autoPlay: false },
  stats: { totalSeconds: 0, lastOpenAt: null }
});

let S = DEFAULT();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && o.v === 1){ S = Object.assign(DEFAULT(), o); return true; }
    }
  }catch(e){}
  return false;
}
let canStore = true;
function save(){
  if(!canStore) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ canStore = false; }
}
load();

/* ═════════════════════════════════════════════════════════
   二、内容（一切皆卡片）
   ═════════════════════════════════════════════════════════ */
const SECTION_ORDER = {
  look:  ['fruits','vegetables','animals','appliance','daily','toys','clothing','vehicle','body'],
  read:  ['poems','stories'],
  play:  ['numbers','shapes','drawing']
};

const CARDS = [
  /* ───── 认东西 · 水果 ───── */
  {id:'apple',lane:'look',type:'object',section:'fruits',emoji:'🍎',palette:'#FFF1E8',zh:'苹果',en:'apple',pinyin:'píng guǒ',
    levels:{L1:{},L2:{sentence_zh:'红红的苹果',sentence_en:'A red apple.'},L3:{sentence_zh:'苹果红红的，甜甜的。',sentence_en:'Apples are red and sweet.',fact:'苹果长在树上。'}}},
  {id:'banana',lane:'look',type:'object',section:'fruits',emoji:'🍌',palette:'#FFF9E0',zh:'香蕉',en:'banana',pinyin:'xiāng jiāo',
    levels:{L1:{},L2:{sentence_zh:'黄黄的香蕉',sentence_en:'A yellow banana.'},L3:{sentence_zh:'香蕉弯弯的，像月亮。',sentence_en:'A banana is curved like the moon.',fact:'香蕉要剥皮吃。'}}},
  {id:'orange',lane:'look',type:'object',section:'fruits',emoji:'🍊',palette:'#FFF2E2',zh:'橘子',en:'orange',pinyin:'jú zi',
    levels:{L1:{},L2:{sentence_zh:'酸酸的橘子',sentence_en:'A sour orange.'},L3:{sentence_zh:'橘子一瓣一瓣的。',sentence_en:'An orange has many pieces.',fact:'橘子皮是橙色的。'}}},
  {id:'grape',lane:'look',type:'object',section:'fruits',emoji:'🍇',palette:'#F3EEFB',zh:'葡萄',en:'grape',pinyin:'pú tao',
    levels:{L1:{},L2:{sentence_zh:'一串葡萄',sentence_en:'A bunch of grapes.'},L3:{sentence_zh:'葡萄一颗一颗，甜甜的。',sentence_en:'Grapes are small and sweet.',fact:'葡萄长在藤上。'}}},
  {id:'watermelon',lane:'look',type:'object',section:'fruits',emoji:'🍉',palette:'#FFECEC',zh:'西瓜',en:'watermelon',pinyin:'xī guā',
    levels:{L1:{},L2:{sentence_zh:'大大的西瓜',sentence_en:'A big watermelon.'},L3:{sentence_zh:'西瓜红红的，有很多汁。',sentence_en:'Watermelon is red and juicy.',fact:'西瓜里有黑色的籽。'}}},

  /* ───── 认东西 · 蔬菜 ───── */
  {id:'carrot',lane:'look',type:'object',section:'vegetables',emoji:'🥕',palette:'#FFF0E4',zh:'胡萝卜',en:'carrot',pinyin:'hú luó bo',
    levels:{L1:{},L2:{sentence_zh:'橙色的胡萝卜',sentence_en:'An orange carrot.'},L3:{sentence_zh:'兔子爱吃胡萝卜。',sentence_en:'Rabbits like carrots.',fact:'胡萝卜长在土里。'}}},
  {id:'tomato',lane:'look',type:'object',section:'vegetables',emoji:'🍅',palette:'#FFEEEC',zh:'西红柿',en:'tomato',pinyin:'xī hóng shì',
    levels:{L1:{},L2:{sentence_zh:'圆圆的西红柿',sentence_en:'A round tomato.'},L3:{sentence_zh:'西红柿可以炒鸡蛋。',sentence_en:'Tomatoes can be cooked with eggs.',fact:'西红柿是红色的。'}}},
  {id:'corn',lane:'look',type:'object',section:'vegetables',emoji:'🌽',palette:'#FFFAE5',zh:'玉米',en:'corn',pinyin:'yù mǐ',
    levels:{L1:{},L2:{sentence_zh:'黄黄的玉米',sentence_en:'Yellow corn.'},L3:{sentence_zh:'玉米一粒一粒的。',sentence_en:'Corn has many little seeds.',fact:'玉米长在秆子上。'}}},

  /* ───── 认东西 · 动物 ───── */
  {id:'cat',lane:'look',type:'object',section:'animals',emoji:'🐱',palette:'#FFF5E8',zh:'猫',en:'cat',pinyin:'māo',
    levels:{L1:{},L2:{sentence_zh:'小猫喵喵叫',sentence_en:'A cat says meow.'},L3:{sentence_zh:'小猫喜欢晒太阳。',sentence_en:'Cats like to sit in the sun.',fact:'猫的胡子可以量宽度。'}}},
  {id:'dog',lane:'look',type:'object',section:'animals',emoji:'🐶',palette:'#FFF6EE',zh:'狗',en:'dog',pinyin:'gǒu',
    levels:{L1:{},L2:{sentence_zh:'小狗汪汪叫',sentence_en:'A dog says woof.'},L3:{sentence_zh:'小狗会摇尾巴。',sentence_en:'Dogs wag their tails.',fact:'狗的鼻子很灵。'}}},
  {id:'fish',lane:'look',type:'object',section:'animals',emoji:'🐟',palette:'#EAF6FB',zh:'鱼',en:'fish',pinyin:'yú',
    levels:{L1:{},L2:{sentence_zh:'鱼在水里游',sentence_en:'A fish swims.'},L3:{sentence_zh:'小鱼在水里游来游去。',sentence_en:'Fish swim in the water.',fact:'鱼用鳃呼吸。'}}},
  {id:'rabbit',lane:'look',type:'object',section:'animals',emoji:'🐰',palette:'#FFF0F4',zh:'兔子',en:'rabbit',pinyin:'tù zi',
    levels:{L1:{},L2:{sentence_zh:'长耳朵兔子',sentence_en:'A rabbit has long ears.'},L3:{sentence_zh:'兔子爱吃胡萝卜。',sentence_en:'Rabbits like carrots.',fact:'兔子跳着走路。'}}},
  {id:'chicken',lane:'look',type:'object',section:'animals',emoji:'🐔',palette:'#FFF7E6',zh:'鸡',en:'chicken',pinyin:'jī',
    levels:{L1:{},L2:{sentence_zh:'小鸡叽叽叫',sentence_en:'A chick says cheep.'},L3:{sentence_zh:'鸡会下蛋。',sentence_en:'Hens lay eggs.',fact:'公鸡早上打鸣。'}}},
  {id:'elephant',lane:'look',type:'object',section:'animals',emoji:'🐘',palette:'#F1F3F7',zh:'大象',en:'elephant',pinyin:'dà xiàng',
    levels:{L1:{},L2:{sentence_zh:'鼻子长长的大象',sentence_en:'An elephant has a long nose.'},L3:{sentence_zh:'大象的耳朵像扇子。',sentence_en:'An elephant has big ears.',fact:'大象是最大的陆地动物。'}}},

  /* ───── 认东西 · 电器 ───── */
  {id:'tv',lane:'look',type:'object',section:'appliance',emoji:'📺',palette:'#EEF1F6',zh:'电视',en:'TV',pinyin:'diàn shì',
    levels:{L1:{},L2:{sentence_zh:'看电视',sentence_en:'Watch TV.'},L3:{sentence_zh:'看电视要离远一点。',sentence_en:'Sit far from the TV.',fact:'看完电视要关掉。'}}},
  {id:'phone',lane:'look',type:'object',section:'appliance',emoji:'📱',palette:'#EFF3F8',zh:'手机',en:'phone',pinyin:'shǒu jī',
    levels:{L1:{},L2:{sentence_zh:'小小的手机',sentence_en:'A small phone.'},L3:{sentence_zh:'手机可以打电话。',sentence_en:'A phone can make calls.',fact:'看手机时间不要太长。'}}},
  {id:'fridge',lane:'look',type:'object',section:'appliance',emoji:'❄️',palette:'#E9F6FA',zh:'冰箱',en:'fridge',pinyin:'bīng xiāng',
    levels:{L1:{},L2:{sentence_zh:'冷冷的冰箱',sentence_en:'A cold fridge.'},L3:{sentence_zh:'冰箱里放着好吃的。',sentence_en:'Food stays cold in a fridge.',fact:'冰箱门要关紧。'}}},
  {id:'fan',lane:'look',type:'object',section:'appliance',emoji:'🌀',palette:'#EEF4F6',zh:'风扇',en:'fan',pinyin:'fēng shàn',
    levels:{L1:{},L2:{sentence_zh:'转呀转的风扇',sentence_en:'A fan spins.'},L3:{sentence_zh:'风扇吹出凉凉的风。',sentence_en:'A fan blows cool air.',fact:'夏天用风扇。'}}},

  /* ───── 认东西 · 日常 ───── */
  {id:'cup',lane:'look',type:'object',section:'daily',emoji:'🥛',palette:'#F2F7FB',zh:'杯子',en:'cup',pinyin:'bēi zi',
    levels:{L1:{},L2:{sentence_zh:'一个杯子',sentence_en:'A cup.'},L3:{sentence_zh:'用杯子喝水。',sentence_en:'Drink water from a cup.',fact:'杯子要轻拿轻放。'}}},
  {id:'spoon',lane:'look',type:'object',section:'daily',emoji:'🥄',palette:'#F5F5F2',zh:'勺子',en:'spoon',pinyin:'sháo zi',
    levels:{L1:{},L2:{sentence_zh:'小小的勺子',sentence_en:'A small spoon.'},L3:{sentence_zh:'用勺子吃饭。',sentence_en:'Eat with a spoon.',fact:'勺子可以舀汤。'}}},
  {id:'chair',lane:'look',type:'object',section:'daily',emoji:'🪑',palette:'#FBF4EA',zh:'椅子',en:'chair',pinyin:'yǐ zi',
    levels:{L1:{},L2:{sentence_zh:'坐椅子',sentence_en:'Sit on a chair.'},L3:{sentence_zh:'椅子有四条腿。',sentence_en:'A chair has four legs.',fact:'坐好，不要摇椅子。'}}},
  {id:'door',lane:'look',type:'object',section:'daily',emoji:'🚪',palette:'#F7F0E6',zh:'门',en:'door',pinyin:'mén',
    levels:{L1:{},L2:{sentence_zh:'打开门',sentence_en:'Open the door.'},L3:{sentence_zh:'进门要先敲门。',sentence_en:'Knock before you open the door.',fact:'门有把手。'}}},

  /* ───── 认东西 · 玩具 ───── */

/* 按 lane 取列表，按 section 顺序排序 */
function listOf(lane){
  const order = SECTION_ORDER[lane] || [];
  return CARDS.filter(c => c.lane === lane)
    .map((c,i) => ({c, i}))
    .sort((a,b) => {
      const d = order.indexOf(a.c.section) - order.indexOf(b.c.section);
      return d !== 0 ? d : a.i - b.i;
    })
    .map(x => x.c);
}

/* ═════════════════════════════════════════════════════════
   四、语音
   ═════════════════════════════════════════════════════════ */
const hasTTS = 'speechSynthesis' in window;
let zhVoice = null, enVoice = null;
function loadVoices(){
  if(!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  // Google 语音是网络语音，离线或代理环境下会静默失败 → 优先本地语音
  const pick = re => {
    const m = vs.filter(v => re.test(v.lang));
    if(!m.length) return null;
    const local = m.filter(v => !/google/i.test(v.name));
    return (local.length ? local : m)[0];
  };
  zhVoice = pick(/^(zh|cmn)/i);
  enVoice = pick(/^en([-_]|$)/i);
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text, lang){
  return new Promise(res => {
    if(!hasTTS || !text){ setTimeout(res, 220); return; }
    let done = false;
    const fin = () => { if(done) return; done = true; clearTimeout(tm); res(); };
    const tm = setTimeout(fin, 6000);           // 语音引擎无响应时不卡死流程
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'zh-CN';
      u.rate = lang === 'en' ? 0.9 : 0.85;
      u.pitch = 1.05;
      u.volume = 1;
      if(lang === 'en' && enVoice) u.voice = enVoice;
      if(lang !== 'en' && zhVoice) u.voice = zhVoice;
      u.onend = fin;
      u.onerror = fin;
      speechSynthesis.speak(u);
    }catch(e){ fin(); }
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const guard = () => stopped;

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1500);
}

function renderHome(){
  applyAge();
  ['look','read','play'].forEach(l => {
    const el = document.querySelector(`[data-prog="${l}"]`);
    if(!el) return;
    const all = listOf(l).length;
    const seen = S.progress[l]?.seen?.length || 0;
    el.textContent = seen ? `${Math.min(seen, all)}/${all}` : `${all} 张`;
  });
  show('homeScreen');
}

function renderCard(){
  const c = list[idx];
  if(!c) return;
  const L = S.ageBand, lv = c.levels?.[L] || c.levels?.L1 || {};
  const card = $('#card');
  card.style.background = c.palette || '#fff';
  // 按内容类型分配图/文比例（文字多的内容给图少一点空间）
  const TYPE_PIC = { object:[65,55,45], poem:[38,33,28], story:[50,42,36], number:[58,48,42], shape:[56,50,44] };
  const li = ({L1:0, L2:1, L3:2})[S.ageBand] || 0;
  const pic = (TYPE_PIC[c.type] || [65,55,45])[li];
  card.style.setProperty('--pic', pic);
  card.style.setProperty('--f-pic', (34 * pic / 65).toFixed(1) + 'vh');
  const inner = $('#cardInner');
  let html = '';

  if(c.type === 'object'){
    html = `
      <div class="pic-area"><div class="pic">${c.emoji}</div></div>
      <div class="text-area">
        <div class="zh" id="zh">${c.zh}</div>
        ${L !== 'L1' ? `<div class="py" id="py">${c.pinyin || ''}</div>` : ''}
        <div class="en" id="en">${c.en}</div>
        ${lv.sentence_zh ? `<div class="sent-zh" id="sZh">${lv.sentence_zh}</div>` : ''}
        ${lv.sentence_en ? `<div class="sent-en" id="sEn">${lv.sentence_en}</div>` : ''}
        ${lv.fact ? `<div class="fact">${lv.fact}</div>` : ''}
      </div>`;
  }
  else if(c.type === 'poem'){
    const lines = lv.lines || c.levels.L1.lines;
    html = `
      <div class="pic-area"><div class="pic">${c.emoji}</div></div>
      <div class="text-area">
        <div class="lines">${lines.map((t,i) => `<div class="line" data-l="${i}">${t}</div>`).join('')}</div>
        <div class="poem-meta">${c.dynasty}·${c.author}《${c.title}》</div>
        ${lv.explain ? `<div class="poem-explain">${lv.explain}</div>` : ''}
      </div>`;
  }
  else if(c.type === 'story'){
    html = `
      <div class="story-tag">${c.page} / ${c.pageCount}</div>
      <div class="pic-area"><div class="pic">${c.emoji}</div></div>
      <div class="text-area">
        <div class="story-title">${c.title}</div>
        <div class="story-text" id="szh">${lv.text || ''}</div>
      </div>`;
  }
  else if(c.type === 'number'){
    html = `
      <div class="pic-area">
        <div class="num-visual">${Array.from({length:c.count}, () => `<span>${c.emoji}</span>`).join('')}</div>
      </div>
      <div class="text-area">
        <div class="num-big" id="zh">${c.count}</div>
        ${L !== 'L1' ? `<div class="py">${c.pinyin}</div>` : ''}
        <div class="en" id="en">${c.en}</div>
      </div>`;
  }
  else if(c.type === 'shape'){
    const SVG = {
      round:    '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#F5904A"/></svg>',
      square:   '<svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="12" fill="#7BC4A8"/></svg>',
      triangle: '<svg viewBox="0 0 100 100"><polygon points="50,8 94,90 6,90" fill="#6FA8E8"/></svg>'
    };
    html = `
      <div class="pic-area"><div class="shape-visual">${SVG[c.shape] || ''}</div></div>
      <div class="text-area">
        <div class="zh" id="zh">${c.zh}</div>
        ${L !== 'L1' ? `<div class="py">${c.pinyin}</div>` : ''}
        <div class="en" id="en">${c.en}</div>
      </div>`;
  }

  inner.innerHTML = html;

  $('#counter').textContent = `${idx + 1} / ${list.length}`;
  $('#barFill').style.width = ((idx + 1) / list.length * 100).toFixed(1) + '%';
  $('#prev').disabled = idx === 0;
  $('#next').disabled = idx === list.length - 1;

  card.style.transform = 'translateX(0)';
  enterAt = Date.now();
  markSeen();
  requestAnimationFrame(fitPic);
}

/* 根据图片区实际尺寸计算主体大小，保证永远不溢出、不遮挡文字 */
function fitPic(){
  const pa = document.querySelector('.pic-area');
  if(!pa) return;
  const h = Math.max(0, pa.clientHeight - 24);
  const w = Math.max(0, pa.clientWidth - 24);
  const base = Math.max(56, Math.min(h * 0.86, w * 0.86));

  const pic = pa.querySelector('.pic');
  if(pic) pic.style.fontSize = base + 'px';

  const nv = pa.querySelector('.num-visual');
  if(nv){
    const n = nv.children.length || 1;
    const s = Math.max(30, Math.min(base / Math.max(1.55, Math.sqrt(n) * 1.5), 200));
    Array.from(nv.children).forEach(el => { el.style.fontSize = s + 'px'; });
  }

  const sv = pa.querySelector('.shape-visual');
  if(sv){
    const side = Math.max(60, Math.min(h, w));
    sv.style.width = side + 'px';
    sv.style.height = side + 'px';
  }
}

function markSeen(){
  const c = list[idx];
  if(!c) return;
  setTimeout(() => {
    if(Date.now() - enterAt < 1800) return;
    const p = S.progress[lane];
    if(!p.seen.includes(c.id)){
      p.seen.push(c.id);
      save();
    }
  }, 2000);
}

function highlight(which){
  document.querySelectorAll('.lit,.dim').forEach(e => e.classList.remove('lit','dim'));
  const map = { zh:'zh', en:'en', sZh:'sZh', sEn:'sEn' };
  const target = map[which];
  if(!target) return;
  document.querySelectorAll('.text-area > *').forEach(e => {
    if(e.id) e.classList.add(e.id === target ? 'lit' : 'dim');
  });
}

/* ═════════════════════════════════════════════════════════
   六、播放
   ═════════════════════════════════════════════════════════ */
function unitParts(c){
  if(c.type === 'object'){
    const lv = c.levels[S.ageBand] || {};
    return { zh:[c.zh, ...(lv.sentence_zh ? [lv.sentence_zh] : [])],
             en:[c.en, ...(lv.sentence_en ? [lv.sentence_en] : [])] };
  }
  if(c.type === 'poem'){
    const lv = c.levels[S.ageBand] || c.levels.L1;
    return { zh: lv.lines || [], en: [] };
  }
  if(c.type === 'story'){
    const lv = c.levels[S.ageBand] || c.levels.L1;
    return { zh: lv.text ? [lv.text] : [], en: [] };
  }
  if(c.type === 'number') return { zh:[c.zh], en:[c.en] };
  if(c.type === 'shape')  return { zh:[c.zh], en:[c.en] };
  return { zh:[], en:[] };
}

async function playAll(){
  if(playing){ stopAll(); return; }
  playing = true; stopped = false;
  if(hasTTS) try{ speechSynthesis.cancel(); }catch(e){}
  $('#play').classList.add('playing');
  $('#play').textContent = '■';

  while(playing && !guard()){
    const c = list[idx];
    const { zh, en } = unitParts(c);

    // 中文 ×2
    for(let r = 0; r < 2 && !guard(); r++){
      for(let i = 0; i < zh.length && !guard(); i++){
        if(c.type === 'poem'){
          document.querySelectorAll('.line').forEach((e,j) => {
            e.classList.toggle('dim', j !== i);
            e.classList.toggle('lit', j === i);
          });
        } else highlight(i === 0 ? 'zh' : 'sZh');
        await speak(zh[i], 'zh');
        await wait(560);
      }
    }
    if(guard()) break;
    await wait(280);

    // 英文 ×2（口语切换前先清掉中文高亮 → 视觉变化）
    if(en.length){
      for(let r = 0; r < 2 && !guard(); r++){
        for(let i = 0; i < en.length && !guard(); i++){
          highlight(i === 0 ? 'en' : 'sEn');
          await speak(en[i], 'en');
          await wait(560);
        }
      }
    }
    highlight(null);
    document.querySelectorAll('.line').forEach(e => e.classList.remove('dim','lit'));
    if(guard()) break;

    await wait(1100);
    if(idx < list.length - 1){ go(1); await wait(480); }
    else break;
  }
  stopAll();
}

function stopAll(){
  playing = false; stopped = true;
  if(hasTTS) try{ speechSynthesis.cancel(); }catch(e){}
  const p = $('#play');
  p.classList.remove('playing');
  p.textContent = '▶';
  highlight(null);
  document.querySelectorAll('.line').forEach(e => e.classList.remove('dim','lit'));
}

async function readOne(){
  if(playing) return;
  const c = list[idx];
  if(!c) return;
  const { zh } = unitParts(c);
  if(c.type === 'poem'){
    for(const t of zh){ await speak(t, 'zh'); await wait(200); }
  }else{
    for(const t of zh){ await speak(t, 'zh'); await wait(240); }
  }
  S.prefs.autoPlay = false; save();
}

/* ═════════════════════════════════════════════════════════
   七、导航（记 id 不记序号）
   ═════════════════════════════════════════════════════════ */
function openLane(l){
  lane = l;
  list = listOf(l);
  const lastId = S.progress[l]?.lastId;
  const found = lastId ? list.findIndex(c => c.id === lastId) : -1;
  idx = found >= 0 ? found : 0;          // 找不到 → 退回开头，不报错
  stopAll();
  renderCard();
  show('cardScreen');
}

function go(step){
  const n = idx + step;
  if(n < 0 || n >= list.length) return;
  idx = n;
  S.progress[lane].lastId = list[idx].id;   // 记 id
  save();
  renderCard();
}

function backHome(){
  stopAll();
  if(lane && list[idx]) { S.progress[lane].lastId = list[idx].id; save(); }
  renderHome();
}

   ═════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const ageBtn = e.target.closest('[data-age]');
  if(ageBtn){
    S.ageBand = ageBtn.dataset.age; save();
    renderHome(); return;
  }
  const entry = e.target.closest('[data-lane]');
  if(entry){ openLane(entry.dataset.lane); return; }
});

$('#ageTag').onclick = () => {
  // 家长改年龄：直接回年龄页
  stopAll();
  show('ageScreen');
};

$('#homeBtn').onclick = backHome;
$('#prev').onclick = () => { stopAll(); go(-1); };
$('#next').onclick = () => { stopAll(); go(1); };
$('#play').onclick = e => { e.stopPropagation(); S.prefs.autoPlay = true; save(); playAll(); };

$('#card').addEventListener('click', e => {
  if(playing) return;
  const line = e.target.closest('.line');
  if(line){ speak(line.textContent, 'zh'); return; }
  readOne();
});

// 滑动翻页
let sx = 0, sy = 0;
$('#card').addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
$('#card').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){ stopAll(); go(dx < 0 ? 1 : -1); }
}, {passive:true});

document.addEventListener('keydown', e => {
  if(!$('#cardScreen').classList.contains('on')) return;
  if(e.key === 'ArrowRight'){ stopAll(); go(1); }
  if(e.key === 'ArrowLeft'){ stopAll(); go(-1); }
  if(e.key === ' '){ e.preventDefault(); playAll(); }
  if(e.key === 'Escape'){ backHome(); }
});

// 离开时保存
let openedAt = Date.now();
function saveStats(){
  S.stats.totalSeconds = (S.stats.totalSeconds || 0) + Math.round((Date.now() - openedAt) / 1000);
  S.stats.lastOpenAt = new Date().toISOString();
  save();
}
window.addEventListener('pagehide', saveStats);
document.addEventListener('visibilitychange', () => { if(document.hidden) saveStats(); });

/* ═════════════════════════════════════════════════════════
   九、启动
   ═════════════════════════════════════════════════════════ */
(function boot(){
  applyAge();
  if(!S.ageBand){
    show('ageScreen');          // 首次：选年龄
  }else{
    renderHome();               // 有记录：直接进首页
  }
  if(!canStore) toast('当前模式无法保存进度');
  if(!hasTTS) toast('当前浏览器不支持语音，将只显示文字');
})();
</script>
